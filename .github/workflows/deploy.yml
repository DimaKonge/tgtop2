name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tgtop-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        run: pnpm run check
      - name: Unit tests
        run: pnpm exec vitest run --exclude server/tonPayoutWallet.credentials.test.ts --exclude server/tonApi.credentials.test.ts --exclude client/src/pages/Home.mobile-rendered.test.ts --pool=forks --poolOptions.forks.singleFork
      - name: Production build
        run: pnpm run build

  deploy:
    name: Stage and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and build release
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Configure SSH
        env:
          TG_TOP_VPS_KEY: ${{ secrets.SERVER_SSH_KEY }}
          TG_TOP_VPS_HOST: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TG_TOP_VPS_KEY" > ~/.ssh/tgtop_deploy
          chmod 600 ~/.ssh/tgtop_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload and activate staged release
        env:
          RELEASE_NAME: release-${{ github.sha }}
          TG_TOP_STAGE_PORT: 3101
        run: |
          export TG_TOP_VPS_KEY="$HOME/.ssh/tgtop_deploy"
          export TG_TOP_VPS_HOST="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          export RELEASE_NAME="release-${{ github.sha }}"
          bash scripts/release-vps.sh
