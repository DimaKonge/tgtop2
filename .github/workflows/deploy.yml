name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tgtop-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        run: pnpm run check
      - name: Unit tests
        run: pnpm exec vitest run --exclude server/telegramUserAgent.test.ts --exclude server/telegramUserApi.credentials.test.ts --exclude server/tonPayoutWallet.credentials.test.ts --exclude server/tonApi.credentials.test.ts --exclude client/src/pages/Home.mobile-rendered.test.ts --pool=forks --poolOptions.forks.singleFork
      - name: Production build
        run: pnpm run build

  deploy:
    name: Stage and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build release
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Configure password-based SSH
        env:
          TG_TOP_VPS_HOST: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload and activate staged release
        env:
          TG_TOP_VPS_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          TG_TOP_VPS_HOST: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          RELEASE_NAME: release-${{ github.sha }}
          TG_TOP_STAGE_PORT: 3101
          SKIP_LOCAL_VERIFY: 1
        run: bash scripts/release-vps.sh
