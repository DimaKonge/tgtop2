name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "=== [1/4] Finding project directory on server ==="
            PROJECT_DIR=""
            for dir in "/opt/tgtop" "$HOME/tgtop2" "/var/www/tgtop" "/var/www/tgtop2" "$HOME/tgtop" "$HOME/tgtop-app"; do
              if [ -d "$dir/.git" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done

            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "/opt/tgtop" ]; then
                PROJECT_DIR="/opt/tgtop"
              else
                PROJECT_DIR="$(pwd)"
              fi
            fi

            echo "Target project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "=== [2/4] Pulling latest changes from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== [3/4] Installing dependencies & building project ==="
            if command -v pnpm &> /dev/null; then
              pnpm install --no-frozen-lockfile
              pnpm run build
            else
              npm install
              npm run build
            fi

            echo "=== [4/4] Restarting services ==="
            if systemctl is-active --quiet tgtop.service 2>/dev/null || [ -f /etc/systemd/system/tgtop.service ]; then
              echo "Restarting systemd services..."
              systemctl restart tgtop.service || true
              systemctl restart tgtop-bot.service 2>/dev/null || true
              systemctl restart tgtop-bot-reserve.service 2>/dev/null || true
              systemctl restart tgtop-payout-worker.service 2>/dev/null || true
              systemctl restart tgtop-owner-dm-worker.service 2>/dev/null || true
              echo "Systemd services restarted successfully."
            fi

            if command -v pm2 &> /dev/null; then
              echo "Restarting PM2 processes..."
              pm2 restart all || true
            fi

            echo "=== DEPLOY COMPLETED SUCCESSFULLY ==="
