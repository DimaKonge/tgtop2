# Included inside the canonical TG TOP TLS server. Static pages and assets inherit
# only a generous connection ceiling; expensive APIs receive request limits.
limit_conn tgtop_connections_per_ip 40;

location = /healthz {
    limit_req zone=tgtop_health_per_ip burst=20 nodelay;
    client_max_body_size 16k;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.createTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=2 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.reconcileTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=4 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.reviewTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=4 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location ^~ /api/trpc/ {
    limit_req zone=tgtop_api_per_ip burst=60 nodelay;
    client_max_body_size 12m;
    add_header Retry-After 2 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}
