# Install at /etc/nginx/snippets/tgtop-edge-server.conf after a config backup.
# This snippet is included inside the canonical TLS server for tgtop.me.
limit_conn tgtop_connections_per_ip 40;

location = /healthz {
    limit_req zone=tgtop_health_per_ip burst=20 nodelay;
    client_max_body_size 16k;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

# High-cost fetch-on-miss routes get stricter independent limits.
location ~ ^/api/telegram-avatar/-?[0-9]{1,32}$ {
    limit_req zone=tgtop_media_per_ip burst=12 nodelay;
    client_max_body_size 16k;
    add_header Retry-After 2 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location ^~ /manus-storage/ {
    limit_req zone=tgtop_media_per_ip burst=16 nodelay;
    client_max_body_size 16k;
    add_header Retry-After 2 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/auth/telegram/login {
    limit_req zone=tgtop_login_per_ip burst=8 nodelay;
    client_max_body_size 16k;
    add_header Retry-After 5 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/auth/telegram/callback {
    limit_req zone=tgtop_login_per_ip burst=12 nodelay;
    client_max_body_size 16k;
    add_header Retry-After 5 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/csp-report {
    limit_req zone=tgtop_csp_per_ip burst=8 nodelay;
    client_max_body_size 16k;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.createTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=2 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.reconcileTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=4 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location = /api/trpc/wallet.reviewTonWithdrawal {
    limit_req zone=tgtop_finance_per_ip burst=4 nodelay;
    client_max_body_size 128k;
    add_header Retry-After 10 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}

location ^~ /api/trpc/ {
    limit_req zone=tgtop_api_per_ip burst=60 nodelay;
    client_max_body_size 256k;
    add_header Retry-After 2 always;
    include /etc/nginx/snippets/tgtop-proxy-common.conf;
}
