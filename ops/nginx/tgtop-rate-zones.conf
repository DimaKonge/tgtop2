# Install at /etc/nginx/conf.d/tgtop-rate-zones.conf after staged verification.
# IP limits are one layer only; a future edge WAF/CDN must restore real-client IP
# before any rate limit if it proxies traffic to this origin.
limit_req_zone $binary_remote_addr zone=tgtop_api_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tgtop_finance_per_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=tgtop_health_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tgtop_media_per_ip:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=tgtop_login_per_ip:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=tgtop_csp_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=tgtop_connections_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
