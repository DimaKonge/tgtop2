# Install the same drop-in at:
#   /etc/systemd/system/tgtop.service.d/20-hardening.conf
#   /etc/systemd/system/tgtop-bot.service.d/20-hardening.conf
#   /etc/systemd/system/tgtop-bot-reserve.service.d/20-hardening.conf
# Validate with `systemd-analyze verify` and restart one service at a time.
[Service]
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=full
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectHostname=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictNamespaces=true
RestrictRealtime=true
SystemCallArchitectures=native
CapabilityBoundingSet=
UMask=0077
